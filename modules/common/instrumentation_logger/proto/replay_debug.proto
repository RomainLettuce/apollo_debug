syntax = "proto2";

package apollo.common;

import "modules/routing/proto/routing.proto";
import "modules/planning/proto/planning.proto";
import "modules/planning/proto/planning_status.proto";

message ReplayInfo {
    optional apollo.routing.RoutingResponse last_routing = 1;
    optional apollo.planning.PlanningStatus planning_status = 2;
    optional apollo.planning.ADCTrajectory traj = 3;
    optional bool path_opt_failure = 4;
    optional bool speed_opt_failure = 5;
}